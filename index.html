<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>GNOMAGEDDON</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{background:repeating-linear-gradient(90deg,#61a94c 0 9%,#579e45 9% 18%);position:relative}body:before{content:"🌸  🌼    🌺     🍄        🌷       🌼    🌸        🍄     🌺";position:fixed;inset:0;line-height:155px;font-size:25px;opacity:.8;word-spacing:28px;pointer-events:none}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px calc(8px + env(safe-area-inset-bottom));position:relative;z-index:1}.title{width:min(92vw,650px);background:linear-gradient(#c18a49,#8b552a);border:5px solid #693d20;border-radius:18px;box-shadow:0 5px #412716,inset 0 2px #e7b86f;text-align:center;font-size:clamp(30px,8vw,50px);font-weight:1000;letter-spacing:2px;padding:5px 10px;text-shadow:0 4px #402415}.sub{font-weight:900;font-size:15px;text-shadow:0 2px #315d2a}.hint{background:#fff5d8;color:#59371d;border:3px solid #c9a160;border-radius:20px;padding:7px 14px;font-size:15px;font-weight:900;box-shadow:0 4px #6d4828;text-align:center;width:min(88vw,620px)}#board{position:relative;width:min(92vw,650px);height:min(calc(100dvh - 300px),600px);aspect-ratio:6/5;flex:none;border:8px solid #704525;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(90deg,#6aa953 0 16.66%,#62a14b 16.66% 33.33%);box-shadow:0 8px #4a2d1b,0 14px 25px #214b2088;touch-action:none}.cell{position:absolute;width:16.6667%;height:20%;border:2px dashed #fff8;display:flex;justify-content:center;align-items:flex-start;padding-top:3px;color:#ffffff44;font-size:9px}.cell.enemy{background:#315b3a18}.cell.player{background:#9bcf6818}.mid{position:absolute;left:50%;top:0;height:100%;border-left:3px dashed #fff9;z-index:2}.unit{position:absolute;width:27%;height:31%;border-radius:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;box-shadow:0 9px 13px #23431d99;transition:left .12s,top .12s;touch-action:none}.unit.selected{outline:4px solid #ffe16b;filter:brightness(1.12);z-index:10}.gnome{background:radial-gradient(circle at 35% 20%,#ffe0ae,#bf7241 52%,#673922);border:4px solid #f5d6a0}.ranger{background:radial-gradient(circle at 35% 20%,#e1ffc8,#5a9e4d 52%,#28592b);border:4px solid #c6e9aa}.fighter{background:radial-gradient(circle at 35% 20%,#ffd3aa,#b65b3d 52%,#55251d);border:4px solid #f4d09d}.healer{background:radial-gradient(circle at 35% 20%,#ffe0ff,#9963b4 52%,#43264d);border:4px solid #eed5ff}.boar{background:radial-gradient(circle at 35% 20%,#f4c0aa,#8e584b 52%,#492925);border:4px solid #efb7a5}.face{font-size:clamp(35px,10vw,70px);line-height:1;text-shadow:0 3px #3338}.name{font-size:clamp(9px,2.3vw,15px);font-weight:1000;text-shadow:0 2px 3px #000;white-space:nowrap}.hp{width:70%;height:7px;background:#0008;border-radius:7px;overflow:hidden;margin-top:4px}.hp i{display:block;height:100%;background:#66d96b}.boar .hp i{background:#ef625c}#msg{min-height:24px;font-size:15px;font-weight:900;text-align:center;text-shadow:0 2px #315d2a}#actions{width:min(72vw,430px)}button{width:100%;border:5px solid #7d351d;border-radius:22px;padding:12px;background:linear-gradient(#ff9b58,#f36c21);color:#fff7e7;font-size:clamp(24px,7vw,34px);font-weight:1000;text-shadow:0 3px #71301b;box-shadow:0 6px #71351f}button:disabled{opacity:.45;filter:saturate(.45)}button:active{transform:translateY(4px);box-shadow:0 2px #71351f}@media(max-height:720px){.title{font-size:29px;padding:3px}.sub{font-size:12px}.hint{font-size:13px;padding:5px}button{padding:8px}.unit{height:30%}}</style></head><body><main id="app"><div class="title">GNOMAGEDDON</div><div class="sub">Gnome vs. Wildschweine</div><div class="hint">Ziehe die Gnome in deine Zone, dann FIGHT!</div><div id="board"></div><div id="msg">Ziehe die Gnome in die rechte Hälfte.</div><div id="actions"><button id="fight" disabled>FIGHT!</button></div></main><script>(()=>{const B=document.querySelector('#board'),M=document.querySelector('#msg'),F=document.querySelector('#fight');let us=[],drag=null,sel=null,wave=1,phase='setup';const U=x=>({...x,alive:true});const H=()=>us.filter(x=>x.team==='g'&&x.alive);const d=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));function p(u){u.el.style.left=(u.x+.5)*100/6+'%';u.el.style.top=(u.y+.5)*100/5+'%'}function draw(){B.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<6;x++){let c=document.createElement('div');c.className='cell '+(x<3?'enemy':'player');c.style.left=x*16.6667+'%';c.style.top=y*20+'%';B.append(c)}let m=document.createElement('div');m.className='mid';B.append(m);us.forEach(u=>{if(!u.alive)return;let e=document.createElement('div');e.className='unit '+u.type+(sel===u?' selected':'');e.innerHTML='<div class="face">'+u.emoji+'</div><div class="name">'+u.name+'</div><div class="hp"><i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i></div>';u.el=e;p(u);if(u.team==='g')e.onpointerdown=down;B.append(e)})}function reset(){phase='setup';sel=null;drag=null;us=[U({team:'g',type:'fighter',name:'Schmiedgnom',emoji:'🧙‍♂️🪓',hp:155,max:155,dmg:36,range:1,x:3,y:4}),U({team:'g',type:'ranger',name:'Waldgnom',emoji:'🏹🧙',hp:110,max:110,dmg:28,range:3,x:4,y:4}),U({team:'g',type:'healer',name:'Heilgnom',emoji:'🧙✨',hp:95,max:95,dmg:12,range:2,x:5,y:4}),U({team:'g',type:'fighter',name:'Steinbart',emoji:'🧙‍♂️🛡️',hp:240,max:240,dmg:18,range:1,x:5,y:3})];for(let i=0;i<Math.min(4,wave);i++)us.push(U({team:'b',type:'boar',name:'Wildschwein',emoji:'🐗',hp:160+wave*15,max:160+wave*15,dmg:18+wave*3,range:1,x:0,y:i}));F.disabled=true;M.textContent='Ziehe die Gnome in deine Zone, dann FIGHT!';draw()}function down(e){if(phase!=='setup')return;e.preventDefault();let u=us.find(x=>x.el===e.currentTarget);sel=u;drag={u,id:e.pointerId};e.currentTarget.setPointerCapture?.(e.pointerId);M.textContent=u.name+' bewegen …'}B.onpointermove=e=>{if(!drag||e.pointerId!==drag.id)return;let r=B.getBoundingClientRect(),x=Math.max(0,Math.min(5,Math.floor((e.clientX-r.left)/r.width*6))),y=Math.max(0,Math.min(4,Math.floor((e.clientY-r.top)/r.height*5)));drag.u.el.style.left=(x+.5)*100/6+'%';drag.u.el.style.top=(y+.5)*100/5+'%'};B.onpointerup=e=>{if(!drag||e.pointerId!==drag.id)return;let r=B.getBoundingClientRect(),x=Math.max(0,Math.min(5,Math.floor((e.clientX-r.left)/r.width*6))),y=Math.max(0,Math.min(4,Math.floor((e.clientY-r.top)/r.height*5))),u=drag.u;drag=null;if(x<3||us.some(v=>v!==u&&v.alive&&v.x===x&&v.y===y)){sel=null;draw();M.textContent=x<3?'Nur die rechte 3×5-Zone ist deine Aufstellung.':'Feld ist besetzt.';return}u.x=x;u.y=y;sel=null;F.disabled=false;draw();M.textContent='Bereit! FIGHT!'};function attack(u){let t=us.filter(v=>v.alive&&v.team!==u.team).sort((a,b)=>d(u,a)-d(u,b))[0];if(!t)return;if(d(u,t)<=u.range)t.hp-=u.dmg;else{let nx=u.x+Math.sign(t.x-u.x),ny=u.y+Math.sign(t.y-u.y);if(nx>=0&&nx<6&&ny>=0&&ny<5&&!us.some(v=>v.alive&&v!==u&&v.x===nx&&v.y===ny)){u.x=nx;u.y=ny}}}F.onpointerdown=()=>{if(phase!=='setup')return;phase='fight';F.disabled=true;M.textContent='⚔️ Kampf läuft …';H().forEach(attack);us.filter(u=>u.alive&&u.team==='b').forEach(b=>{let t=H().sort((a,c)=>d(b,a)-d(b,c))[0];if(t&&d(b,t)<=b.range)t.hp-=b.dmg});us.forEach(u=>{if(u.hp<=0)u.alive=false});draw();setTimeout(()=>{if(!H().length){M.textContent='💀 Garten verloren.';return}if(!us.some(u=>u.team==='b'&&u.alive)){if(wave<4){wave++;M.textContent='✓ Welle geschafft!';setTimeout(reset,700)}else M.textContent='🏆 Garten gerettet!';return}phase='setup';F.disabled=false;M.textContent='Nächste Runde – positioniere deine Gnome.';draw()},450)};reset()})()</script></body></html>
