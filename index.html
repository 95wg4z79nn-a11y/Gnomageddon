<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102016"><title>GNOMAGEDDON</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0b160e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:manipulation}#app{height:100dvh;max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:10px}h1{font-size:clamp(30px,8vw,52px);letter-spacing:3px;text-align:center;margin:0;text-shadow:0 4px 0 #0008}.sub{text-align:center;opacity:.8;font-size:13px}.stats{display:flex;gap:7px}.stat{flex:1;background:#111d14;border:1px solid #d8bb594d;border-radius:12px;padding:7px;text-align:center;font-weight:800;font-size:14px}.label{opacity:.65;font-size:10px;display:block}.value{font-size:17px}#board{position:relative;width:min(92vw,600px);aspect-ratio:1;margin:auto;border:4px solid #d8bb59;border-radius:20px;overflow:hidden;background:linear-gradient(#557a3d 0 33.3%,#628b45 33.3% 66.6%,#527c3f 66.6%);box-shadow:0 15px 40px #0008;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);touch-action:manipulation;contain:layout paint}.cell{border:1px solid #fff3;display:flex;align-items:center;justify-content:center;color:#fff3;font-size:10px}.unit{position:absolute;width:27%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;z-index:5;box-shadow:0 8px 10px #0008;transition:transform .16s ease-out;touch-action:manipulation;will-change:transform;pointer-events:auto}.unit.selected{filter:brightness(1.12);outline:4px solid #ffe16b}.gnome{background:radial-gradient(circle at 35% 25%,#f5d19d,#9b6338 48%,#59351f);border:3px solid #f3d8a7}.ranger{background:radial-gradient(circle at 35% 25%,#d5f4b8,#4e9149 48%,#28562d);border:3px solid #bce4a2}.boar{background:radial-gradient(circle at 35% 25%,#efb4a0,#875044 48%,#4a2927);border:3px solid #e7b09e}.face{font-size:clamp(27px,8vw,50px);line-height:1}.name{font-size:clamp(8px,2.3vw,13px);text-shadow:0 2px 2px #000}.hp{width:72%;height:6px;background:#0009;border-radius:5px;overflow:hidden;margin-top:3px}.hp i{display:block;height:100%;background:#6bd66f}.boar .hp i{background:#ef695d}#message{text-align:center;min-height:35px;font-weight:700;padding:2px 5px}button{width:100%;border:0;border-radius:16px;padding:15px;background:linear-gradient(#f1d66d,#b48b35);color:#241b06;font-size:22px;font-weight:950;box-shadow:0 5px 0 #604616;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 2px 0 #604616}button:disabled{opacity:.45;filter:grayscale(.6)}#overlay{position:absolute;inset:0;background:#071009ee;display:none;align-items:center;justify-content:center;z-index:30;padding:25px}.card{background:#17281b;border:2px solid #d8bb59aa;border-radius:22px;padding:25px;text-align:center;width:min(90%,440px)}.card h2{font-size:34px;margin:0 0 8px}.card p{opacity:.85}.card button{margin-top:10px}
</style></head><body><div id="app"><h1>GNOMAGEDDON</h1><div class="sub">Mobile Prototype · Touch Edition</div><div class="stats"><div class="stat"><span class="label">WELLE</span><span class="value" id="wave">1 / 4</span></div><div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div><div class="stat"><span class="label">STATUS</span><span class="value" id="phase">AUFSTELLEN</span></div></div><div id="board"></div><div id="message">Tippe einen Gnom an, dann ein Feld.</div><button id="fight" disabled>⚔ FIGHT</button></div><div id="overlay"><div class="card"><h2 id="resultTitle">SIEG!</h2><p id="resultText"></p><button id="again">NOCHMAL</button></div></div>
<script>
(()=>{
const board=document.getElementById('board'),message=document.getElementById('message'),fight=document.getElementById('fight'),waveEl=document.getElementById('wave'),scoreEl=document.getElementById('score'),phaseEl=document.getElementById('phase'),overlay=document.getElementById('overlay'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText');
let wave=1,score=0,selected=null,running=false,units=[],last=0,acc=0;
const unit=o=>Object.assign({alive:true,cd:0,el:null,hpEl:null},o);
function reset(){running=false;selected=null;units=[unit({id:1,team:'gnome',type:'gnome',name:'Schmied',emoji:'🧙',hp:180,max:180,dmg:22,x:0,y:2}),unit({id:2,team:'gnome',type:'ranger',name:'Waldgnom',emoji:'🌲',hp:110,max:110,dmg:30,x:2,y:2})];const n=wave===4?1:wave;for(let i=0;i<n;i++)units.push(unit({id:10+i,team:'boar',type:'boar',name:wave===4?'BOSS':'Wildschwein',emoji:'🐗',hp:wave===4?520:180-wave*8,max:wave===4?520:180-wave*8,dmg:wave===4?34:20+wave*3,x:i%3,y:0}));waveEl.textContent=wave+' / 4';phaseEl.textContent='AUFSTELLEN';message.textContent='Tippe einen Gnom an, dann ein Feld.';fight.disabled=true;build();syncAll(true)}
function pos(u){return `translate3d(${((u.x+.5)/3*100)}%,${((u.y+.5)/3*100)}%,0) translate3d(-50%,-50%,0)`}
function build(){board.innerHTML='';for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.dataset.x=i%3;c.dataset.y=Math.floor(i/3);c.textContent=i%3+1+'/'+(Math.floor(i/3)+1);c.addEventListener('pointerup',cellTap);board.appendChild(c)}for(const u of units){const e=document.createElement('div');e.className='unit '+u.type;e.innerHTML='<div class="face">'+u.emoji+'</div><div class="name">'+u.name+'</div><div class="hp"><i></i></div>';u.el=e;u.hpEl=e.querySelector('i');if(u.team==='gnome')e.addEventListener('pointerup',ev=>{if(running)return;ev.preventDefault();ev.stopPropagation();selected=u;message.textContent=u.name+' ausgewählt – jetzt Zielfeld antippen.';syncAll(false)});board.appendChild(e)}}
function syncAll(force){for(const u of units){if(!u.alive){u.el.style.display='none';continue}u.el.style.display='flex';u.el.classList.toggle('selected',selected===u);u.el.style.transform=pos(u);u.hpEl.style.width=Math.max(0,u.hp/u.max*100)+'%';if(force)u.el.style.transition='none';else u.el.style.transition='transform .16s ease-out'}if(force)requestAnimationFrame(()=>units.forEach(u=>{if(u.el)u.el.style.transition='transform .16s ease-out'}))}
function cellTap(e){if(running||!selected)return;const x=+e.currentTarget.dataset.x,y=+e.currentTarget.dataset.y;if(y<1){message.textContent='Bitte ein Feld in der unteren Hälfte wählen.';return}if(units.some(u=>u.alive&&u!==selected&&u.x===x&&u.y===y)){message.textContent='Dieses Feld ist besetzt.';return}selected.x=x;selected.y=y;selected=null;fight.disabled=false;message.textContent='Bereit. FIGHT starten!';syncAll(false)}
const dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
function nearest(u){let best=null,bd=99;for(const x of units)if(x.alive&&x.team!==u.team){const d=dist(u,x);if(d<bd){bd=d;best=x}}return best}
function tick(dt){if(!running)return;let gs=units.filter(u=>u.alive&&u.team==='gnome'),bs=units.filter(u=>u.alive&&u.team==='boar');if(!gs.length){finish(false);return}if(!bs.length){finish(true);return}for(const u of units){if(!u.alive)continue;u.cd-=dt;if(u.cd>0)continue;const t=nearest(u);if(!t)continue;const range=u.type==='ranger'?2:1;if(dist(u,t)<=range){t.hp-=u.dmg;u.cd=u.team==='gnome'?.7:1;if(t.hp<=0){t.hp=0;t.alive=false}}else{const dx=Math.sign(t.x-u.x),dy=Math.sign(t.y-u.y),nx=u.x+dx,ny=u.y+dy;if(nx>=0&&nx<=2&&ny>=0&&ny<=2&&!units.some(v=>v.alive&&v!==u&&v.x===nx&&v.y===ny)){u.x=nx;u.y=ny}u.cd=.45}}syncAll(false)}
function loop(ts){if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;acc+=dt;if(running&&acc>=.1){tick(acc);acc=0}requestAnimationFrame(loop)}
function finish(win){running=false;phaseEl.textContent=win?'SIEG':'VERLOREN';if(win){score+=wave*150;scoreEl.textContent=score;if(wave<4){message.textContent='Welle geschafft!';setTimeout(()=>{wave++;reset()},700)}else{resultTitle.textContent='🏆 GARTEN GERETTET';resultText.textContent='Alle vier Wellen überlebt. Score: '+score;overlay.style.display='flex'}}else{resultTitle.textContent='💀 GNOMEAGEDDON';resultText.textContent='Die Wildschweine haben den Garten übernommen.';overlay.style.display='flex'}}
fight.addEventListener('pointerup',()=>{if(running)return;running=true;phaseEl.textContent='KAMPF';message.textContent='⚔️ Kampf läuft!';fight.disabled=true});document.getElementById('again').addEventListener('pointerup',()=>{overlay.style.display='none';wave=1;score=0;scoreEl.textContent='0';reset()});reset();requestAnimationFrame(loop);
})();
</script></body></html>
