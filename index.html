<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>GNOMAGEDDON</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#08150d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100dvh;min-height:0;padding:7px 12px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;overflow:hidden}h1{text-align:center;margin:0;font-size:clamp(30px,7vw,48px);line-height:1;letter-spacing:3px;text-shadow:0 4px #000}.sub{text-align:center;opacity:.8;font-size:14px;line-height:18px}.stats{display:flex;gap:6px}.stat{flex:1;text-align:center;border:1px solid #d8bb5966;border-radius:11px;padding:4px 3px;background:#111d14;font-weight:800}.label{display:block;font-size:9px;opacity:.65;line-height:12px}.value{font-size:16px;line-height:19px}#board{position:relative;width:min(94vw,620px);max-width:calc(100dvh - 285px);height:auto;aspect-ratio:1;margin:3px auto 2px;flex:none;border:4px solid #d8bb59;border-radius:20px;overflow:hidden;background:#5c8645;box-shadow:0 15px 40px #0008;touch-action:none;user-select:none}.cell{position:absolute;width:33.3333%;height:33.3333%;border:1px solid #ffffff45;color:#ffffff55;display:flex;align-items:center;justify-content:center;font-size:10px;pointer-events:none}.unit{position:absolute;width:27%;height:27%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;font-weight:900;box-shadow:0 8px 12px #0009;transform:translate(-50%,-50%);transition:left .16s ease-out,top .16s ease-out,filter .12s,transform .12s;pointer-events:auto;touch-action:none}.unit.selected{outline:4px solid #ffe16b;filter:brightness(1.18);transform:translate(-50%,-50%) scale(1.04)}.unit.hit{animation:hit .18s ease-out}.unit.dead{animation:dead .25s ease-out forwards}.gnome{background:radial-gradient(circle at 35% 25%,#f5d19d,#9b6338 48%,#59351f);border:3px solid #f3d8a7}.ranger{background:radial-gradient(circle at 35% 25%,#d5f4b8,#4e9149 48%,#28562d);border:3px solid #bce4a2}.boar{background:radial-gradient(circle at 35% 25%,#efb4a0,#875044 48%,#4a2927);border:3px solid #e7b09e}.boss{background:radial-gradient(circle at 35% 25%,#ffd46f,#9b4d28 48%,#421c19);border-color:#ffe16b;box-shadow:0 0 18px #ffbf3c99,0 8px 12px #0009}.face{font-size:clamp(23px,6.5vw,42px);line-height:1}.name{font-size:clamp(8px,2.3vw,13px);text-shadow:0 2px #000}.hp{width:72%;height:6px;background:#0008;border-radius:5px;overflow:hidden;margin-top:3px}.hp i{display:block;height:100%;background:#68d36c;transition:width .12s}.boar .hp i{background:#ef695d}.boss .hp i{background:#ffbf3c}#message{text-align:center;min-height:27px;font-size:14px;line-height:18px;font-weight:700;display:flex;align-items:center;justify-content:center}button{width:100%;border:0;border-radius:15px;padding:12px;background:linear-gradient(#f1d66d,#b48b35);color:#241b06;font-size:21px;font-weight:950;box-shadow:0 4px #604616;touch-action:manipulation;flex:none}button:disabled{opacity:.45}button:active{transform:translateY(3px);box-shadow:0 1px #604616}@keyframes hit{50%{filter:brightness(1.8);transform:translate(-50%,-50%) scale(1.07)}}@keyframes dead{to{opacity:0;transform:translate(-50%,-50%) scale(.65)}}@media(max-height:720px){h1{font-size:29px}.sub{font-size:12px}.stat{padding:2px}.value{font-size:14px}#board{max-width:calc(100dvh - 245px)}button{padding:9px;font-size:19px}}@media(min-width:700px){#app{max-width:680px;margin:auto}}
</style></head><body><main id="app"><h1>GNOMAGEDDON</h1><div class="sub">Mobile Prototype · Touch Edition</div><div class="stats"><div class="stat"><span class="label">WELLE</span><span id="wave" class="value">1 / 4</span></div><div class="stat"><span class="label">SCORE</span><span id="score" class="value">0</span></div><div class="stat"><span class="label">STATUS</span><span id="phase" class="value">AUFSTELLEN</span></div></div><div id="board"></div><div id="message">Ziehe einen Gnom auf ein freies Feld.</div><button id="fight" disabled>⚔ FIGHT</button></main><script>(()=>{const B=document.getElementById('board'),M=document.getElementById('message'),F=document.getElementById('fight'),P=document.getElementById('phase'),W=document.getElementById('wave'),S=document.getElementById('score');let units=[],selected=null,drag=null,running=false,wave=1,score=0,transition=false;const U=o=>({...o,alive:true,cd:0,el:null});function pos(u){if(u.el){u.el.style.left=((u.x+.5)*100/3)+'%';u.el.style.top=((u.y+.5)*100/3)+'%'}}function cell(x,y){let c=document.createElement('div');c.className='cell';c.style.left=x*33.3333+'%';c.style.top=y*33.3333+'%';c.textContent=(x+1)+'/'+(y+1);B.appendChild(c)}function render(){B.querySelectorAll('.cell,.unit').forEach(e=>e.remove());for(let y=0;y<3;y++)for(let x=0;x<3;x++)cell(x,y);for(const u of units){if(!u.alive)continue;let cls='unit '+u.type+(selected===u?' selected':'');if(u.type==='boss')cls+=' boss';let e=document.createElement('div');e.className=cls;e.dataset.id=u.id;e.innerHTML='<div class="face">'+u.emoji+'</div><div class="name">'+u.name+'</div><div class="hp"><i></i></div>';u.el=e;u.hpEl=e.querySelector('i');pos(u);u.hpEl.style.width=Math.max(0,u.hp/u.max*100)+'%';e.addEventListener('pointerdown',startDrag,{passive:false});B.appendChild(e)}}function reset(){running=false;transition=false;selected=null;drag=null;units=[U({id:1,team:'g',type:'gnome',name:'Schmied',emoji:'🧙',hp:180,max:180,dmg:22,x:0,y:2}),U({id:2,team:'g',type:'ranger',name:'Waldgnom',emoji:'🌲',hp:110,max:110,dmg:30,x:2,y:2})];let n=wave===4?1:wave;for(let i=0;i<n;i++)units.push(U({id:10+i,team:'b',type:wave===4?'boss':'boar',name:wave===4?'BOSS':'Wildschwein',emoji:wave===4?'👹':'🐗',hp:wave===4?520:180-wave*8,max:wave===4?520:180-wave*8,dmg:wave===4?34:20+wave*3,x:i,y:0}));W.textContent=wave+' / 4';P.textContent='AUFSTELLEN';M.textContent=wave===4?'⚠️ BOSS-WELLE: Der Gartenwächter wartet.':'Ziehe einen Gnom auf ein freies Feld.';F.disabled=true;render()}function startDrag(e){if(running||transition)return;e.preventDefault();e.stopPropagation();const u=units.find(v=>v.el===e.currentTarget);if(!u||u.team!=='g')return;selected=u;drag={u,pointer:e.pointerId};e.currentTarget.setPointerCapture?.(e.pointerId);M.textContent=u.name+' wird bewegt – loslassen auf einem freien Feld.';render()}B.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const r=B.getBoundingClientRect(),x=Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/r.width*3))),y=Math.max(0,Math.min(2,Math.floor((e.clientY-r.top)/r.height*3)));drag.u.el.style.left=((x+.5)*100/3)+'%';drag.u.el.style.top=((y+.5)*100/3)+'%'});B.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const r=B.getBoundingClientRect(),x=Math.max(0,Math.min(2,Math.floor((e.clientX-r.left)/r.width*3))),y=Math.max(0,Math.min(2,Math.floor((e.clientY-r.top)/r.height*3))),u=drag.u;drag=null;const occupied=units.some(v=>v!==u&&v.alive&&v.x===x&&v.y===y);if(occupied||y<1){pos(u);M.textContent=occupied?'Feld ist besetzt.':'Nur die untere Hälfte ist für die Aufstellung frei.';selected=null;render();return}u.x=x;u.y=y;selected=null;F.disabled=false;M.textContent=u.name+' steht auf '+(x+1)+'/'+(y+1)+'. FIGHT starten!';render()});function dist(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))}function flash(u){if(u.el){u.el.classList.remove('hit');void u.el.offsetWidth;u.el.classList.add('hit')}}function tick(){if(!running||transition)return;let gs=units.filter(u=>u.alive&&u.team==='g'),bs=units.filter(u=>u.alive&&u.team==='b');if(!gs.length){running=false;P.textContent='VERLOREN';M.textContent='💀 Die Wildschweine haben gewonnen.';render();return}if(!bs.length){running=false;score+=wave*150;S.textContent=score;if(wave<4){transition=true;P.textContent='SIEG';M.textContent='✓ Welle '+wave+' geschafft! Nächste Welle wird vorbereitet …';render();setTimeout(()=>{wave++;reset()},900)}else{P.textContent='SIEG';M.textContent='🏆 Garten gerettet! Boss besiegt.';render()}return}for(const u of units){if(!u.alive||--u.cd>0)continue;let targets=units.filter(v=>v.alive&&v.team!==u.team),t=targets.sort((a,b)=>dist(u,a)-dist(u,b))[0];if(!t)continue;let range=u.type==='ranger'?2:1;if(dist(u,t)<=range){t.hp-=u.dmg;flash(t);u.cd=u.team==='g'?.7:1;if(t.hp<=0){t.alive=false;if(t.el){t.el.classList.add('dead')}}}else{let nx=u.x+Math.sign(t.x-u.x),ny=u.y+Math.sign(t.y-u.y);if(nx>=0&&nx<3&&ny>=0&&ny<3&&!units.some(v=>v.alive&&v!==u&&v.x===nx&&v.y===ny)){u.x=nx;u.y=ny}u.cd=.45}}render();setTimeout(tick,100)}F.addEventListener('pointerdown',e=>{e.preventDefault();if(running||transition)return;running=true;P.textContent='KAMPF';M.textContent='⚔️ Kampf läuft!';F.disabled=true;tick()});reset()})();</script></body></html>
