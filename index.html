<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>GNOMAGEDDON</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#08150d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{height:100dvh;padding:7px 12px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;overflow:hidden}h1{text-align:center;margin:0;font-size:clamp(30px,7vw,48px);line-height:1;letter-spacing:3px;text-shadow:0 4px #000}.sub{text-align:center;opacity:.8;font-size:14px;line-height:18px}.stats{display:flex;gap:6px}.stat{flex:1;text-align:center;border:1px solid #d8bb5966;border-radius:11px;padding:4px 3px;background:#111d14;font-weight:800}.label{display:block;font-size:9px;opacity:.65}.value{font-size:16px}#board{position:relative;width:min(94vw,720px);max-width:calc(100dvh - 285px);aspect-ratio:6/5;margin:3px auto 2px;flex:none;border:4px solid #d8bb59;border-radius:20px;overflow:hidden;background:#5c8645;box-shadow:0 15px 40px #0008;touch-action:none;user-select:none}.cell{position:absolute;width:16.6667%;height:20%;border:1px solid #ffffff40;display:flex;align-items:flex-start;justify-content:center;padding-top:5px;font-size:9px;pointer-events:none}.cell.enemy{background:#315b3a22}.cell.player{background:#718f3d22}.midline{position:absolute;left:50%;top:0;width:2px;height:100%;background:#f4d66a66;z-index:2}.unit{position:absolute;width:15%;height:18%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;font-weight:900;box-shadow:0 7px 11px #0009;transform:translate(-50%,-50%);transition:left .16s ease-out,top .16s ease-out,filter .12s;pointer-events:auto;touch-action:none}.unit.selected{outline:3px solid #ffe16b;filter:brightness(1.18)}.unit.hit{animation:hit .18s ease-out}.gnome{background:radial-gradient(circle at 35% 25%,#f5d19d,#9b6338 48%,#59351f);border:3px solid #f3d8a7}.ranger{background:radial-gradient(circle at 35% 25%,#d5f4b8,#4e9149 48%,#28562d);border:3px solid #bce4a2}.tank{background:radial-gradient(circle at 35% 25%,#b7c6d7,#4e6477 48%,#263846);border:3px solid #d7e4ef}.fighter{background:radial-gradient(circle at 35% 25%,#f1c39b,#a64e35 48%,#4b211b);border:3px solid #f3d8a7}.healer{background:radial-gradient(circle at 35% 25%,#f0d5ff,#895aa8 48%,#39234a);border:3px solid #ead3ff}.boar{background:radial-gradient(circle at 35% 25%,#efb4a0,#875044 48%,#4a2927);border:3px solid #e7b09e}.boss{background:radial-gradient(circle at 35% 25%,#ffd46f,#9b4d28 48%,#421c19);border-color:#ffe16b;box-shadow:0 0 18px #ffbf3c99,0 7px 11px #0009}.face{font-size:clamp(18px,5vw,36px);line-height:1}.name{font-size:clamp(7px,1.8vw,12px);text-shadow:0 2px #000;white-space:nowrap}.hp{width:72%;height:5px;background:#0008;border-radius:5px;overflow:hidden;margin-top:2px}.hp i{display:block;height:100%;background:#68d36c}.tank .hp i{background:#78b8ef}.fighter .hp i{background:#ef8a62}.healer .hp i{background:#d69af5}.boar .hp i{background:#ef695d}.boss .hp i{background:#ffbf3c}#message{text-align:center;min-height:27px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}#actions{display:flex;gap:7px}button{flex:1;border:0;border-radius:15px;padding:11px;background:linear-gradient(#f1d66d,#b48b35);color:#241b06;font-size:18px;font-weight:950;box-shadow:0 4px #604616;touch-action:manipulation}button:disabled{opacity:.4}button:active{transform:translateY(3px);box-shadow:0 1px #604616}.info{font-size:11px;text-align:center;opacity:.65;min-height:14px}@keyframes hit{50%{filter:brightness(1.8);transform:translate(-50%,-50%) scale(1.08)}}@media(max-height:720px){h1{font-size:28px}.sub{font-size:11px}.stat{padding:2px}button{padding:8px;font-size:17px}}
</style></head><body><main id="app"><h1>GNOMAGEDDON</h1><div class="sub">Taktik-Prototyp · Runde für Runde</div><div class="stats"><div class="stat"><span class="label">WELLE</span><span id="wave" class="value">1 / 4</span></div><div class="stat"><span class="label">SCORE</span><span id="score" class="value">0</span></div><div class="stat"><span class="label">PHASE</span><span id="phase" class="value">AUFSTELLEN</span></div></div><div id="board"></div><div id="message">4 Gnome wählen und rechts aufstellen.</div><div id="actions"><button id="end" disabled>ENDE ZUG</button><button id="fight" disabled>⚔ KAMPF</button></div><div class="info" id="info">Tank 🛡 · Kämpfer ⚔ · Waldgnom 🏹 · Heiler ✨</div></main><script>(()=>{const B=document.getElementById('board'),M=document.getElementById('message'),E=document.getElementById('end'),F=document.getElementById('fight'),P=document.getElementById('phase'),W=document.getElementById('wave'),S=document.getElementById('score'),I=document.getElementById('info');let units=[],selected=null,drag=null,running=false,wave=1,score=0,phase='setup',turn=1;const U=o=>({...o,alive:true,cd:0,el:null});const heroes=()=>units.filter(u=>u.team==='g'&&u.alive);function pos(u){if(u.el){u.el.style.left=((u.x+.5)*100/6)+'%';u.el.style.top=((u.y+.5)*100/5)+'%'}}function render(){B.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<6;x++){let c=document.createElement('div');c.className='cell '+(x<3?'enemy':'player');c.style.left=x*16.6667+'%';c.style.top=y*20+'%';B.appendChild(c)}let mid=document.createElement('div');mid.className='midline';B.appendChild(mid);for(const u of units){if(!u.alive)continue;let e=document.createElement('div');e.className='unit '+u.type+(selected===u?' selected':'');e.innerHTML='<div class="face">'+u.emoji+'</div><div class="name">'+u.name+'</div><div class="hp"><i></i></div>';u.el=e;u.hpEl=e.querySelector('i');pos(u);u.hpEl.style.width=Math.max(0,u.hp/u.max*100)+'%';if(u.team==='g')e.addEventListener('pointerdown',startDrag,{passive:false});B.appendChild(e)}}function reset(){running=false;phase='setup';turn=1;selected=null;drag=null;units=[U({id:1,team:'g',type:'tank',name:'Steinbart',emoji:'🛡️',hp:240,max:240,dmg:18,range:1,x:3,y:4}),U({id:2,team:'g',type:'ranger',name:'Waldgnom',emoji:'🏹',hp:110,max:110,dmg:28,range:3,x:5,y:4}),U({id:3,team:'g',type:'fighter',name:'Axtgnom',emoji:'⚔️',hp:155,max:155,dmg:36,range:1,x:4,y:3}),U({id:4,team:'g',type:'healer',name:'Heilgnom',emoji:'✨',hp:95,max:95,dmg:12,range:2,heal:28,x:5,y:3})];let n=Math.min(4,wave);for(let i=0;i<n;i++)units.push(U({id:10+i,team:'b',type:'boar',name:'Wildschwein',emoji:'🐗',hp:160+wave*15,max:160+wave*15,dmg:18+wave*3,range:1,x:0,y:Math.min(4,i)}));if(wave===4)units.push(U({id:99,team:'b',type:'boss',name:'Gartenwächter',emoji:'👹',hp:520,max:520,dmg:34,range:1,x:0,y:2}));W.textContent=wave+' / 4';P.textContent='AUFSTELLEN';M.textContent='4 Gnome auf der rechten 3×5-Hälfte platzieren.';E.disabled=true;F.disabled=true;I.textContent='🛡 Tank: viel HP · 🏹 Fernkampf: Reichweite 3 · ⚔ Kämpfer: hoher Schaden · ✨ Heiler: heilt';render()}function startDrag(e){if(phase!=='setup'||running)return;e.preventDefault();e.stopPropagation();const u=units.find(v=>v.el===e.currentTarget);if(!u)return;selected=u;drag={u,pointer:e.pointerId};e.currentTarget.setPointerCapture?.(e.pointerId);M.textContent=u.name+' bewegen – auf der rechten Hälfte loslassen.'}B.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const r=B.getBoundingClientRect(),x=Math.max(0,Math.min(5,Math.floor((e.clientX-r.left)/r.width*6))),y=Math.max(0,Math.min(4,Math.floor((e.clientY-r.top)/r.height*5)));drag.u.el.style.left=((x+.5)*100/6)+'%';drag.u.el.style.top=((y+.5)*100/5)+'%'});B.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;e.preventDefault();const r=B.getBoundingClientRect(),x=Math.max(0,Math.min(5,Math.floor((e.clientX-r.left)/r.width*6))),y=Math.max(0,Math.min(4,Math.floor((e.clientY-r.top)/r.height*5))),u=drag.u;drag=null;const occupied=units.some(v=>v!==u&&v.alive&&v.x===x&&v.y===y);if(occupied||x<3){M.textContent=occupied?'Feld ist besetzt.':'Nur die rechte 3×5-Hälfte ist deine Aufstellung.';selected=null;render();return}u.x=x;u.y=y;selected=null;E.disabled=false;M.textContent=u.name+' positioniert. Du kannst weitere Gnome verschieben.';render()});function dist(a,b){return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))}function nearestEnemy(u){return units.filter(v=>v.alive&&v.team!==u.team).sort((a,b)=>dist(u,a)-dist(u,b))[0]}function act(u){let t=nearestEnemy(u);if(u.type==='healer'){let ally=heroes().filter(v=>v!==u&&v.hp<v.max&&dist(u,v)<=u.range).sort((a,b)=>(a.hp/a.max)-(b.hp/b.max))[0];if(ally){ally.hp=Math.min(ally.max,ally.hp+u.heal);return 'heilt '+ally.name} }if(!t)return'';if(dist(u,t)<=u.range){t.hp-=u.dmg;return 'traf '+t.name}else{let nx=u.x+Math.sign(t.x-u.x),ny=u.y+Math.sign(t.y-u.y);if(nx>=0&&nx<6&&ny>=0&&ny<5&&!units.some(v=>v.alive&&v!==u&&v.x===nx&&v.y===ny)){u.x=nx;u.y=ny}return 'bewegt sich'}}function enemyAct(u){let t=heroes().sort((a,b)=>dist(u,a)-dist(u,b))[0];if(!t)return;if(dist(u,t)<=u.range)t.hp-=u.dmg;else{let nx=u.x+Math.sign(t.x-u.x),ny=u.y+Math.sign(t.y-u.y);if(nx>=0&&nx<6&&ny>=0&&ny<5&&!units.some(v=>v.alive&&v!==u&&v.x===nx&&v.y===ny)){u.x=nx;u.y=ny}}}function begin(){phase='player';P.textContent='DEIN ZUG';E.disabled=false;F.disabled=false;M.textContent='Bewege deine Gnome. ENDE ZUG führt zum Gegnerzug.';render()}E.addEventListener('pointerdown',()=>{if(phase!=='player')return;phase='enemy';P.textContent='GEGNER';E.disabled=true;F.disabled=true;M.textContent='Gegner sind am Zug …';render();setTimeout(()=>{units.filter(u=>u.alive&&u.team==='b').forEach(enemyAct);units=units.filter(u=>u.alive||u.team!=='b'||u.hp>0);if(!heroes().length){phase='lost';P.textContent='VERLOREN';M.textContent='💀 Garten verloren.';render();return}phase='player';turn++;P.textContent='DEIN ZUG';E.disabled=false;F.disabled=false;M.textContent='Runde '+turn+': Positionieren oder kämpfen.';render()},650)});F.addEventListener('pointerdown',()=>{if(phase!=='player')return;phase='resolving';P.textContent='KAMPF';E.disabled=true;F.disabled=true;let log=[];for(const u of heroes()){if(!u.alive)continue;log.push(u.name+' '+act(u));units.filter(v=>v.hp<=0).forEach(v=>v.alive=false)}if(!units.some(u=>u.team==='b'&&u.alive)){score+=wave*150;S.textContent=score;if(wave<4){wave++;M.textContent='✓ Welle geschafft!';setTimeout(reset,900)}else{phase='win';P.textContent='SIEG';M.textContent='🏆 Garten gerettet!';render()}return}M.textContent=log.join(' · ');render();setTimeout(()=>{if(phase==='resolving'){phase='player';turn++;P.textContent='DEIN ZUG';E.disabled=false;F.disabled=false;M.textContent='Gegner reagiert erst nach ENDE ZUG.';render()}},600)});reset()})();</script></body></html>
